# 設定位置：偏好設定在 config.yaml，金鑰與 SMTP 在 data/secrets.env。
# .env 為選填，只用來覆蓋下方 ${...} 變數：JOURNAL_WEB_BIND、JOURNAL_WEB_PORT、TZ 等。
name: ${JOURNAL_PROJECT_NAME:-journal-featured}

x-build-args: &build-args
  PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim-trixie}
  UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.5}

x-environment: &environment
  TZ: ${TZ:-Asia/Taipei}   # 排程時區；排程本身在 config.yaml 的 schedule

x-app: &app
  image: journal-featured:latest
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-config: &config
  type: bind
  source: ./config.yaml
  target: /app/config.yaml
  bind: {selinux: z}

x-data: &data
  type: bind
  source: ./data
  target: /app/data
  bind: {selinux: z}

x-hf-cache: &hf-cache
  type: volume
  source: hf-cache
  target: /cache/huggingface

services:
  app:
    <<: *app
    build:
      context: .
      args: *build-args
    container_name: journal-featured
    environment: *environment
    volumes:
      - {<<: *config, read_only: true}
      - *data
      - *hf-cache

  # 網頁：唯讀瀏覽入選文章，與 app 共用映像檔。連結全為相對路徑，放在反向代理的任何子路徑下都能用。
  web:
    <<: *app
    pull_policy: never          # 映像檔由 app 建置，不從 registry 拉
    depends_on: [app]
    container_name: journal-featured-web
    environment: *environment
    command: [python, -m, journal_featured.web.app, --host=0.0.0.0, --port=8501]
    ports:
      - "${JOURNAL_WEB_BIND:-127.0.0.1}:${JOURNAL_WEB_PORT:-8501}:8501"   # 預設只允許本機連線
    volumes:
      - {<<: *config, read_only: true}
      - *data                   # 只讀取，但 SQLite WAL 模式的讀者也需要寫入 -shm 檔
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  hf-cache:
