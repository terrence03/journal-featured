# 設定位置：偏好設定在 config.yaml，金鑰與 SMTP 在 data/secrets.env（皆可在網頁上修改）。
# .env 為選填，只用來覆蓋下方 ${...} 變數：JOURNAL_WEB_BIND、JOURNAL_WEB_PORT、JOURNAL_BASE_PATH、TZ 等。
name: ${JOURNAL_PROJECT_NAME:-journal-featured}

x-build-args: &build-args
  PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim-trixie}
  UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.5}

x-environment: &environment
  TZ: ${TZ:-Asia/Taipei}   # 排程時區；排程本身在 config.yaml 的 schedule

x-app: &app
  image: journal-featured:latest
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-config: &config
  type: bind
  source: ./config.yaml
  target: /app/config.yaml
  bind: {selinux: z}

x-data: &data
  type: bind
  source: ./data
  target: /app/data
  bind: {selinux: z}

x-hf-cache: &hf-cache
  type: volume
  source: hf-cache
  target: /cache/huggingface

services:
  app:
    <<: *app
    build:
      context: .
      args: *build-args
    container_name: journal-featured
    environment: *environment
    volumes:
      - {<<: *config, read_only: true}
      - *data
      - *hf-cache

  # 網頁介面：與 app 共用映像檔，可直接觸發執行；config.yaml 可寫以便在網頁上修改設定。
  web:
    <<: *app
    pull_policy: never          # 映像檔由 app 建置，不從 registry 拉
    depends_on: [app]
    container_name: journal-featured-web
    environment:
      <<: *environment
      JOURNAL_BASE_PATH: ${JOURNAL_BASE_PATH:-}
    command:
      - streamlit
      - run
      - src/journal_featured/web/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --server.baseUrlPath=${JOURNAL_BASE_PATH:-}   # 選填：掛在子路徑下時設定（例如 app）；預設為根路徑
      - --client.toolbarMode=minimal        # 隱藏開發用的 Deploy 按鈕
      - --browser.serverAddress=localhost   # log 只印 localhost 網址，不印連不到的容器／公網 IP
    ports:
      - "${JOURNAL_WEB_BIND:-127.0.0.1}:${JOURNAL_WEB_PORT:-8501}:8501"   # 預設只允許本機連線
    volumes:
      - *config
      - *data
      - *hf-cache
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; p = os.environ.get('JOURNAL_BASE_PATH', '').strip('/'); urllib.request.urlopen('http://127.0.0.1:8501/' + (p + '/' if p else '') + '_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  hf-cache:
