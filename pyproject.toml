[project]
name = "journal-featured"
version = "0.1.0"
description = "Weekly journal article picker by topic similarity"
readme = "README.md"
authors = [
    { name = "terrence" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.4.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruamel-yaml>=0.19.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
journal-featured = "journal_featured.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only torch keeps the Docker image small (no CUDA wheels).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
